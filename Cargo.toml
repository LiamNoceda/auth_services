[package]
name = "auth_spatial"
version = "0.1.0"
edition = "2024"

[dependencies]
# serve
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["cors"] }

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "ipnetwork", "uuid"] }
dotenvy = "0.15"
argon2 = { version = "0.5.3", features = ["password-hash"] }
validator = { version = "0.21.0", features = ["derive"] }

# auth
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tracing = "0.1.44"

[profile.release]
opt-level = 3       
lto = true          
codegen-units = 1   
strip = true        
